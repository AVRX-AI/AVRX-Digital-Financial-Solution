<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1630" />
      <stop offset="60%" stop-color="#040814" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Ambient Outer Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Bevel Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Linear Gradients for AVRX Monogram Facets -->
    <!-- Apex 'A' Titanium Gradient -->
    <linearGradient id="apexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#DCE8FF" />
      <stop offset="70%" stop-color="#7B93B8" />
      <stop offset="100%" stop-color="#3B4B66" />
    </linearGradient>

    <!-- Cyber Blue Energy Gradient (V & A Core) -->
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60EFFF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <!-- FinTech 24K Gold Wing Gradient (R & X Dynamic Accent) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#FFD043" />
      <stop offset="70%" stop-color="#E59B12" />
      <stop offset="100%" stop-color="#996000" />
    </linearGradient>

    <!-- Dark Titanium Metal Gradient -->
    <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Subtle Outer Cyber Border -->
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-opacity="0.4" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Background Ambient Cyber Glow Orb -->
  <circle cx="256" cy="245" r="140" fill="#00D2FF" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="320" cy="270" r="90" fill="#FFB800" opacity="0.08" filter="url(#neonGlow)" />

  <!-- AVRX MONOGRAM EMBLEM GROUP -->
  <g filter="url(#dropShadow)">
    
    <!-- 1. LEFT WING of 'A' / Left arm of 'V' -->
    <path 
      d="M 148 372 L 236 128 L 256 128 L 198 372 Z" 
      fill="url(#apexGradient)" 
    />

    <!-- Left Wing Shadow Facet -->
    <path 
      d="M 148 372 L 180 372 L 236 128 L 210 128 Z" 
      fill="url(#darkMetalGrad)" 
      opacity="0.4"
    />

    <!-- 2. RIGHT DOWNWARD CHEVRON forming 'A' and 'V' Structure -->
    <path 
      d="M 256 128 L 276 128 L 364 372 L 314 372 L 256 210 L 222 305 L 198 238 Z" 
      fill="url(#darkMetalGrad)"
    />

    <!-- 3. CENTRAL ELECTRIC CYBER CHEVRON (Representing 'V' & Tech Vector) -->
    <path 
      d="M 256 182 L 298 300 L 256 362 L 214 300 Z" 
      fill="url(#cyberBlueGrad)" 
      filter="url(#neonGlow)"
    />
    <path 
      d="M 256 200 L 286 288 L 256 338 L 226 288 Z" 
      fill="#FFFFFF" 
      opacity="0.3"
    />

    <!-- 4. GOLDEN UPWARD GROWTH ARROW & 'R'/'X' DYNAMIC CROSS-SWOOSH -->
    <!-- Sweeping upwards from lower-left across the center to upper-right -->
    <path 
      d="M 132 322 C 175 285 235 235 348 165 L 340 148 L 398 140 L 378 198 L 360 182 C 265 240 200 290 148 335 Z" 
      fill="url(#goldGradient)"
    />

    <!-- 5. 'X' LOWER-RIGHT STABILIZER ARM (Completing the AVRX Monogram) -->
    <path 
      d="M 292 278 L 372 372 L 324 372 L 264 302 Z" 
      fill="url(#apexGradient)"
    />

    <!-- Top Apex Highlight Spike -->
    <polygon 
      points="256,118 266,134 256,128 246,134" 
      fill="#60EFFF"
    />

  </g>

  <!-- Glowing Corner Tech Nodes -->
  <circle cx="86" cy="86" r="3.5" fill="#00F0FF" opacity="0.6" />
  <circle cx="426" cy="86" r="3.5" fill="#FFB800" opacity="0.6" />
  <circle cx="86" cy="426" r="3.5" fill="#00F0FF" opacity="0.4" />
  <circle cx="426" cy="426" r="3.5" fill="#10B981" opacity="0.5" />
</svg>
