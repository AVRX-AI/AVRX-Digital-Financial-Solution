<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="l_bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <linearGradient id="l_apexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="l_cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0F0" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="l_goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="l_silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="l_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#l_bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#CBD5E1" stroke-width="2" />

  <g filter="url(#l_shadow)">
    <!-- LEFT WING of 'A' -->
    <path d="M 148 372 L 236 128 L 256 128 L 198 372 Z" fill="url(#l_apexGradient)" />
    <path d="M 148 372 L 180 372 L 236 128 L 210 128 Z" fill="url(#l_silverGradient)" opacity="0.3" />

    <!-- RIGHT DOWNWARD CHEVRON -->
    <path d="M 256 128 L 276 128 L 364 372 L 314 372 L 256 210 L 222 305 L 198 238 Z" fill="url(#l_silverGradient)" />

    <!-- CENTRAL ELECTRIC BLUE CHEVRON -->
    <path d="M 256 182 L 298 300 L 256 362 L 214 300 Z" fill="url(#l_cyberBlueGrad)" />

    <!-- GOLDEN SWOOSH -->
    <path d="M 132 322 C 175 285 235 235 348 165 L 340 148 L 398 140 L 378 198 L 360 182 C 265 240 200 290 148 335 Z" fill="url(#l_goldGradient)" />

    <!-- 'X' ARM -->
    <path d="M 292 278 L 372 372 L 324 372 L 264 302 Z" fill="url(#l_apexGradient)" />

    <!-- Apex Top Marker -->
    <polygon points="256,118 266,134 256,128 246,134" fill="#0284C7" />
  </g>
</svg>
