<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#08142b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Radial Ambient Glows -->
  <circle cx="200" cy="150" r="280" fill="#06B6D4" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="320" fill="#8B5CF6" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="220" fill="#3B82F6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Accent Laser Rail -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanPurpleGrad)"/>

  <!-- Left Content Area: Typography & Brand -->
  <g transform="translate(80, 100)">
    <!-- AVRX Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="5" fill="#06B6D4"/>
    <text x="32" y="22" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AVRX DIGITAL ARCHITECTURE</text>

    <!-- Main Title Heading -->
    <text x="0" y="85" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Website Design &amp;
    </text>
    <text x="0" y="140" fill="url(#accentGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Development Services
    </text>

    <!-- Subtitle -->
    <text x="0" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
      2026 Enterprise Guide for Indian Businesses &amp; MSMEs
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="23" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Sub-Second Speed</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="150" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="185" y="23" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📱 Mobile Responsive</text>

      <!-- Pill 3 -->
      <rect x="330" y="0" width="135" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="350" y="23" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🎯 SEO Optimized</text>
    </g>

    <!-- Regional Trust Tag -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="465" height="42" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
      <text x="20" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
        📍 Serving Businesses across Raipur, Bilaspur, Ambikapur &amp; All India
      </text>
    </g>
  </g>

  <!-- Right Visual Area: Mockup & Futuristic Browser Frame -->
  <g transform="translate(640, 80)">
    <!-- Outer Glow Frame -->
    <rect x="-10" y="-10" width="490" height="470" rx="24" fill="#06B6D4" fill-opacity="0.04" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Browser Window Card -->
    <rect x="0" y="0" width="470" height="450" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="0" y="0" width="470" height="42" rx="18" fill="#090d16"/>
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#EF4444"/>
    <circle cx="44" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="21" r="6" fill="#10B981"/>

    <!-- Search Bar Mock -->
    <rect x="95" y="10" width="280" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="110" y="25" fill="#64748B" font-family="monospace" font-size="11">https://www.avrx.in</text>

    <!-- Browser Content Body -->
    <g transform="translate(25, 60)">
      <!-- Mini Hero Card -->
      <rect x="0" y="0" width="420" height="130" rx="12" fill="#0b1329" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Mini Visual Elements -->
      <text x="20" y="32" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">FAST &amp; CONVERTING WEB ARCHITECTURE</text>
      <text x="20" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Next-Gen Digital Experience</text>
      <text x="20" y="86" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Automated leads, WhatsApp CTA &amp; 99.9% uptime</text>
      
      <!-- Mini CTA -->
      <rect x="20" y="98" width="100" height="22" rx="6" fill="#06B6D4"/>
      <text x="35" y="113" fill="#020617" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Explore AVRX</text>

      <!-- Code Snippet Card -->
      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="420" height="110" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="24" fill="#64748B" font-family="monospace" font-size="11">// Modern Tech Stack: React, Tailwind, Vite</text>
        <text x="15" y="44" fill="#38BDF8" font-family="monospace" font-size="11">const <tspan fill="#A78BFA">digitalPlatform</tspan> = {</text>
        <text x="30" y="64" fill="#F43F5E" font-family="monospace" font-size="11">performance: <tspan fill="#34D399">'sub-second'</tspan>,</text>
        <text x="30" y="84" fill="#F43F5E" font-family="monospace" font-size="11">leadConversion: <tspan fill="#FBBF24">'3.8x higher'</tspan></text>
        <text x="15" y="102" fill="#38BDF8" font-family="monospace" font-size="11">};</text>
      </g>

      <!-- Bottom Mini Stats Metric Grid -->
      <g transform="translate(0, 270)">
        <rect x="0" y="0" width="130" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="26" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">₹4,999</text>
        <text x="15" y="46" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Starting Price</text>

        <rect x="145" y="0" width="130" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="160" y="26" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">100%</text>
        <text x="160" y="46" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Ownership &amp; SSL</text>

        <rect x="290" y="0" width="130" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="305" y="26" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">48-72h</text>
        <text x="305" y="46" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Rapid Delivery</text>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(80, 580)">
    <text x="0" y="25" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
      AVRX Digital &amp; Financial Solution • www.avrx.in
    </text>
    <circle cx="420" cy="20" r="3" fill="#475569"/>
    <text x="435" y="25" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      Leading Web &amp; MSME Advisory in India
    </text>
  </g>
</svg>
