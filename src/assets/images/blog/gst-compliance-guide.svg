    <rect x="0" y="0" width="460" height="42" rx="18" fill="#090d16"/>
    <circle cx="24" cy="21" r="6" fill="#EF4444"/>
    <circle cx="44" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="21" r="6" fill="#10B981"/>
    <rect x="95" y="10" width="270" height="22" rx="6" fill="#1e293b"/>
    <text x="110" y="25" fill="#64748B" font-family="monospace" font-size="11">https://www.avrx.in/tax-portal</text>

    <g transform="translate(20, 60)">
      <!-- Filing Status Card -->
      <rect x="0" y="0" width="420" height="100" rx="12" fill="#1c1305" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
      <text x="20" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MONTHLY TAX RECONCILIATION</text>
      <text x="20" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">GSTR-1 &amp; GSTR-3B Sync: OK</text>
      <text x="20" y="82" fill="#34D399" font-family="system-ui, sans-serif" font-size="11">✓ Ineligible ITC blocked • 100% Eligible ITC claimed</text>

      <!-- Checklist -->
