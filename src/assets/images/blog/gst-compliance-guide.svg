        <rect x="0" y="0" width="420" height="110" rx="10" fill="#020617" stroke="#1e293b"/>
        <text x="15" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Audit &amp; Compliance Checklist</text>
        <text x="15" y="48" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">• 11th of every month: GSTR-1 Outward Supplies</text>
        <text x="15" y="68" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">• 20th of every month: GSTR-3B Summary Return &amp; Tax</text>
        <text x="15" y="88" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">• Annual ITR Filing with 26AS, AIS, and TIS Verification</text>
      </g>

      <!-- Bottom Metric -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="420" height="85" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AVRX Tax &amp; Legal Support Cell</text>
        <text x="20" y="50" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Notice resolution, GST revocation &amp; audited financial reporting</text>
        <text x="20" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Helping 500+ MSMEs avoid penalties and stay compliant</text>
