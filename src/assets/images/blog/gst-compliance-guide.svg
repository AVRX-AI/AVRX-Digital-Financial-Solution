<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="taxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#191107"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="amberRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="taxGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
    <filter id="taxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#taxBg)"/>
  <rect width="1200" height="675" fill="url(#taxGrid)"/>

  <circle cx="200" cy="180" r="300" fill="#F59E0B" fill-opacity="0.12" filter="url(#taxGlow)"/>
  <circle cx="1020" cy="480" r="300" fill="#EF4444" fill-opacity="0.1" filter="url(#taxGlow)"/>

  <rect x="0" y="0" width="1200" height="4" fill="url(#amberRose)"/>

  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="5" fill="#F59E0B"/>
    <text x="32" y="22" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AVRX TAX &amp; LEGAL COMPLIANCE</text>

    <text x="0" y="85" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      GST Compliance &amp;
    </text>
    <text x="0" y="140" fill="url(#amberRose)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      ITR Filing Guide 2026
    </text>

    <text x="0" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
      Master GSTR-1, GSTR-3B, ITC 2B Reconciliation &amp; Zero Penalties
    </text>

    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="150" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="23" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚖️ 100% ITC Claim</text>

      <rect x="165" y="0" width="155" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="185" y="23" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📅 Zero Late Fees</text>

      <rect x="335" y="0" width="155" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="355" y="23" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📈 Strong Bank CIBIL</text>
    </g>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="500" height="42" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
      <text x="20" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
        📍 Accurate Monthly Filings for Traders, Manufacturers &amp; Consultants in India
      </text>
    </g>
  </g>

  <!-- Right Visual Mock: Tax Portal View -->
  <g transform="translate(650, 90)">
